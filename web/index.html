<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MikroKit-Emu</title>
<link rel="icon" type="image/png" href="icon-64.png">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8e6e1; }
  @media (prefers-color-scheme: dark) { html, body { background: #1b1b1b; } }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font: 16px system-ui, sans-serif; color: #777; pointer-events: none; }
</style>
</head>
<body>
<canvas id="mikrokit"></canvas>
<div id="loading">Loading MikroKit-Emu…</div>
<script type="module">
  import init from './mikrokit-emu.js';
  init().catch(e => { document.getElementById('loading').textContent = 'MikroKit-Emu couldn’t start: ' + e; });
</script>
</body>
</html>
