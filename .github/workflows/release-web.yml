# Adds the browser version (mikrokit-emu-web.zip) to every published release.
name: Web version for releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add the zip to (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  web-zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust for WebAssembly
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen (the version in Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - name: wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build
        run: web/build.sh --zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" web/mikrokit-emu-web.zip --clobber
