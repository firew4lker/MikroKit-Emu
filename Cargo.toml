[package]
name = "mikrokit-emu"
version = "1.0.0"
edition = "2024"
description = "MikroKit-Emu: an emulator of the Micro Design Mikrokit 8085 trainer"
license = "GPL-3.0-or-later"
repository = "https://github.com/firew4lker/MikroKit-Emu"
readme = "README.md"

[dependencies]
# wgpu (Vulkan/Direct3D 12/Metal) by default, OpenGL (glow) as the fallback
eframe = { version = "0.37", features = ["persistence", "glow"] }
serde = { version = "1.0.229", features = ["derive"] }
# std::time::Instant panics in the browser; this is std's on the desktop
web-time = "1"
# file dialogs (in the browser: the upload dialog)
rfd = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.7", default-features = false }

# the browser version (see web/)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement",
  "Blob", "BlobPropertyBag", "Url", "Navigator", "Clipboard",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# winit doesn't report the desktop theme on Linux; ask the XDG portal.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Windows: bundle egui's monochrome emoji fonts so the toolbar icons don't
# depend on which symbol fonts this Windows version has.
[target.'cfg(windows)'.dependencies]
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
# print --help and --assemble output when started from a console
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug"] }
